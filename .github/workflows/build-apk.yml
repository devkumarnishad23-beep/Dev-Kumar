name: Build APK
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"123456","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456:android:abcd","android_client_info":{"package_name":"com.bajrang.akhada"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          echo "MAPS_API_KEY=dummy_key" > secrets.properties
          echo "MAPS_API_KEY=dummy_key" > app/secrets.properties
          cat app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jai-Bajrang-Akhada-APK
          path: app/build/outputs/apk/debug/app-debug.apk
