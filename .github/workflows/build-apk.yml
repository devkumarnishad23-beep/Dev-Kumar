name: Build APK
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.bajrang.akhada"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          echo "MAPS_API_KEY=dummy" > secrets.properties
          echo "MAPS_API_KEY=dummy" > app/secrets.properties

      - name: Create gradlew if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, creating wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew
          ls -lh ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jai-Bajrang-Akhada-APK
          path: app/build/outputs/apk/debug/app-debug.apk
